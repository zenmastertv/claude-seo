<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO Audit Viewer</title>
  <script>
    try { const t = localStorage.getItem("seo-viewer-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <a class="crumbs" href="#overview">
      <span class="logo" aria-hidden="true"></span>
      <span class="crumb-domain" id="domainTitle">audit</span>
      <span class="crumb-sep">/</span>
      <span class="crumb-date mono" id="domainSub"></span>
    </a>
    <div class="topbar-right">
      <button class="search-btn" id="searchBtn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <span class="search-label">Search</span><kbd>⌘K</kbd>
      </button>
      <select id="auditSelect" class="select audit-select" aria-label="Choose audit"></select>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"><p class="muted">Loading…</p></main>
  </div>

  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette" role="dialog" aria-label="Command palette">
      <div class="palette-input-wrap">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="paletteInput" placeholder="Jump to a view, finding, task or report" autocomplete="off" spellcheck="false">
        <kbd>esc</kbd>
      </div>
      <div class="palette-list" id="paletteList" role="listbox"></div>
      <div class="palette-foot mono"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>/</kbd> or <kbd>⌘K</kbd> to open</span></div>
    </div>
  </div>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
  <script src="app.js"></script>
</body>
</html>
